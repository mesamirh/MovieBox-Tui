name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get version from Cargo.toml
        id: check
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if gh release view "v$VERSION" &>/dev/null; then
            echo "is_new=false" >> $GITHUB_OUTPUT
            echo "Release v$VERSION already exists. Skipping build."
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
            echo "New version v$VERSION detected."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Release quality gate
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbc08259452af873d75fb0b04a8b846 # v2
        with:
          prefix-key: "release-quality"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo package --locked
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.90.0
      - run: cargo check --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [check-version, quality]
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@82a92a6e8fbc08259452af873d75fb0b04a8b846 # v2
        with:
          prefix-key: "release-build-${{ matrix.target }}"

      - name: Install cross
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build macOS or Windows binary
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive Unix
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/moviebox-tui dist/
          cp README.md dist/
          cp LICENSE-* dist/ || true
          
          if [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            tar -czvf MovieBox_Linux_x64.tar.gz -C dist .
          elif [ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]; then
            tar -czvf MovieBox_Linux_arm64.tar.gz -C dist .
          else
            tar -czvf moviebox-tui-${{ matrix.target }}.tar.gz -C dist .
          fi

      - name: Archive Windows
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          cp target\${{ matrix.target }}\release\moviebox-tui.exe dist\
          cp README.md dist\
          cp LICENSE-* dist\ || echo "No license files found"
          if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") {
            Compress-Archive -Path dist\* -DestinationPath MovieBox_Windows_arm64.zip
          } else {
            Compress-Archive -Path dist\* -DestinationPath MovieBox_Windows_x64.zip
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  build-macos-universal:
    name: Build macOS Universal
    needs: [check-version, build]
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-x86_64-apple-darwin
          path: x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-aarch64-apple-darwin
          path: aarch64

      - name: Create Universal Binary
        run: |
          mkdir -p universal/dist
          tar -xzf x86_64/moviebox-tui-x86_64-apple-darwin.tar.gz -C x86_64/
          tar -xzf aarch64/moviebox-tui-aarch64-apple-darwin.tar.gz -C aarch64/
          lipo -create -output universal/dist/moviebox-tui x86_64/moviebox-tui aarch64/moviebox-tui
          cp README.md universal/dist/
          cp LICENSE-* universal/dist/ || true
          cd universal/dist
          tar -czvf ../../MovieBox_macOS_Universal.tar.gz .

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-universal-apple-darwin
          path: MovieBox_macOS_Universal.tar.gz

  release:
    name: Create Release
    needs: [check-version, build, build-macos-universal]
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          find artifacts -type f \( -name 'MovieBox_*.tar.gz' -o -name 'MovieBox_*.zip' \) -print0 |
            sort -z |
            while IFS= read -r -d '' file; do
              hash=$(sha256sum "$file" | awk '{print $1}')
              echo "$hash  $(basename "$file")"
            done > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/**/MovieBox_*.tar.gz
            artifacts/**/MovieBox_*.zip
            SHA256SUMS
      - name: Generate Release Notes and Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          name: "v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/**/MovieBox_*.tar.gz
            artifacts/**/MovieBox_*.zip
            SHA256SUMS
