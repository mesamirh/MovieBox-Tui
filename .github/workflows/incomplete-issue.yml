name: Issue Intake & Quality Guard

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    if: "!github.event.issue.pull_request"
    steps:
      - name: Validate and triage issue
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const eventName = context.eventName;

            function parseSemver(v) {
              const cleaned = (v || '').replace(/^[vV]/, '').trim();
              const parts = cleaned.split('.').map(n => parseInt(n, 10));
              if (parts.length >= 3 && parts.every(n => !isNaN(n))) {
                return parts.slice(0, 3);
              }
              return null;
            }

            function isOlder(current, latest) {
              for (let i = 0; i < 3; i++) {
                if (current[i] < latest[i]) return true;
                if (current[i] > latest[i]) return false;
              }
              return false;
            }

            if (eventName === 'issue_comment') {
              const comment = context.payload.comment;
              const isAuthor = comment.user && issue.user && comment.user.login === issue.user.login;
              const hasNeedsInfo = (issue.labels || []).some(l => l.name === 'needs-info' || l.name === 'stale');

              if (isAuthor && hasNeedsInfo) {
                const labelsToRemove = ['needs-info', 'stale'];
                for (const label of labelsToRemove) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: label
                    });
                  } catch (_) {}
                }
              }
              return;
            }

            const body = (issue.body || '').trim();
            if (!body) return;

            const isBugReport = (issue.labels || []).some(l => l.name === 'bug') ||
              (issue.title || '').toLowerCase().startsWith('bug:');

            if (!isBugReport) return;

            function extractSection(headerName) {
              const regex = new RegExp(`###\\s*${headerName}[\\r\\n]+([\\s\\S]*?)(?=###|$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const description = extractSection('Description');
            const steps = extractSection('Steps to Reproduce');
            const userVersionRaw = extractSection('Version');
            const osRaw = extractSection('Operating System');
            const playerRaw = extractSection('Media Player');

            const labelsToAdd = new Set();
            const feedbackPoints = [];

            if (osRaw.includes('Android')) labelsToAdd.add('os: android');
            else if (osRaw.includes('Linux')) labelsToAdd.add('os: linux');
            else if (osRaw.includes('macOS')) labelsToAdd.add('os: macos');
            else if (osRaw.includes('Windows')) labelsToAdd.add('os: windows');

            const titleAfterPrefix = (issue.title || '')
              .replace(/^(bug|feat|fix|refactor|chore|docs|perf)(\([^)]+\))?:\s*/i, '')
              .trim();
            const genericTitlePattern = /^(none|na|n\/a|error|bug|issue|help|not working|broken|its show error|please fix)$/i;
            const isTitleGeneric = titleAfterPrefix.length < 5 || genericTitlePattern.test(titleAfterPrefix);

            const isTooShort = (text) => {
              const stripped = text.replace(/[`*_\s\r\n-]/g, '');
              return stripped.length < 15;
            };
            const placeholderPattern = /^(none|na|n\/a|nil|error|not working|broken|please fix|please resolved?|v?\d+(\.\d+)*)$/i;

            const descriptionIncomplete = isTooShort(description) || placeholderPattern.test(description);
            const stepsIncomplete = isTooShort(steps) || placeholderPattern.test(steps);

            if (isTitleGeneric || descriptionIncomplete || stepsIncomplete) {
              labelsToAdd.add('needs-info');
              feedbackPoints.push('**Incomplete Details**: Please provide a descriptive issue title, concrete description of what failed, and exact numbered steps to reproduce.');
            }

            let latestVersionStr = null;
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestVersionStr = release.data.tag_name || release.data.name;
            } catch (_) {}

            if (latestVersionStr) {
              const latestParsed = parseSemver(latestVersionStr);
              const userParsed = parseSemver(userVersionRaw);

              if (latestParsed && userParsed && isOlder(userParsed, latestParsed)) {
                labelsToAdd.add('outdated-version');
                const latestClean = latestParsed.join('.');
                const userClean = userParsed.join('.');

                let upgradeCmd = 'curl -fsSL https://raw.githubusercontent.com/mesamirh/MovieBox-Tui/main/install.sh | bash';
                if (osRaw.includes('macOS')) {
                  upgradeCmd = 'brew upgrade moviebox-tui (or re-run install.sh)';
                } else if (osRaw.includes('Windows')) {
                  upgradeCmd = 'irm https://raw.githubusercontent.com/mesamirh/MovieBox-Tui/main/install.ps1 | iex';
                }

                feedbackPoints.push(`**Outdated Version**: This report specifies version \`${userClean}\`, but the latest release is \`${latestClean}\`.\nPlease update to the latest release and verify if the issue persists:\n\`\`\`sh\n${upgradeCmd}\n\`\`\``);
              }
            }

            if (osRaw.includes('Android') && (playerRaw.includes('None') || playerRaw.includes('Other'))) {
              feedbackPoints.push('**Android / Termux Playback**: Video playback on Android requires external video player dispatch. Ensure `termux-tools` and `termux-am` are installed:\n```sh\npkg update && pkg install -y termux-tools termux-am\n```');
            }

            if (labelsToAdd.size > 0) {
              const currentLabels = (issue.labels || []).map(l => l.name);
              const newLabels = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
              if (newLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: newLabels
                });
              }
            }

            if (feedbackPoints.length > 0 && context.payload.action === 'opened') {
              const commentBody = [
                'Thank you for opening an issue.',
                '',
                ...feedbackPoints,
                '',
                'Issues flagged with `needs-info` are closed automatically after 7 days of inactivity.'
              ].join('\n\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody
              });
            }
