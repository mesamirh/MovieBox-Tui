name: Stale Issue Lifecycle

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale needs-info issues
        uses: actions/stale@v11
        with:
          only-labels: "needs-info"
          days-before-issue-stale: 7
          days-before-issue-close: 2
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been marked as stale because it has been awaiting required
            information for 7 days without a response. It will be closed in 2 days if
            no update is provided.
          close-issue-message: >
            This issue was closed due to inactivity and missing reproduction details.
            If the problem persists, please submit a new issue with complete reproduction steps.
          exempt-issue-labels: "pinned,security"
          days-before-pr-stale: -1
          days-before-pr-close: -1
