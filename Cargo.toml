[package]
name = "moviebox-tui"
exclude = ["assets/", ".github/", "scripts/", "install.sh", "install.ps1"]
version = "0.1.7"
edition = "2024"
description = "A terminal client for finding and streaming movies, TV shows, and anime from the MovieBox catalog."
repository = "https://github.com/mesamirh/MovieBox-Tui"
homepage = "https://github.com/mesamirh/MovieBox-Tui"
license = "MIT OR Apache-2.0"
keywords = ["tui", "moviebox", "streaming", "movies", "cli"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
rust-version = "1.85.0"

[dependencies]
base64 = "0.22.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
hmac = "0.13.0"
image = "0.25.10"
lru = "0.18.1"
md-5 = "0.11.0"
rand = "0.10.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
scraper = "0.24.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
url = "2.5.8"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"

[lib]
name = "moviebox_tui"
path = "src/lib.rs"
