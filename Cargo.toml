[package]
name = "moviebox-tui"
exclude = [
    "assets/",
    "docs/",
    "Formula/",
    ".github/",
    ".githooks/",
    ".cargo/",
    "install.sh",
    "install.ps1",
    "CONTRIBUTING.md",
    ".gitignore",
]
version = "0.1.14"
edition = "2024"
description = "Terminal interface to find, download, and stream movies, TV shows, and live TV using local media players."
repository = "https://github.com/mesamirh/MovieBox-Tui"
homepage = "https://github.com/mesamirh/MovieBox-Tui"
license = "MIT OR Apache-2.0"
keywords = ["tui", "moviebox", "streaming", "movies", "cli"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
rust-version = "1.90.0"

[dependencies]
base64 = "0.23.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.18.1"
md-5 = "0.11.0"
rand = "0.10.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
scraper = "0.27.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
url = "2.5.8"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
open = "5.4.0"
percent-encoding = "2.3.2"
log = "0.4.33"
flexi_logger = "0.31.10"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
sha2 = "0.11.0"
flate2 = "1.0.35"
tar = "0.4.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.17.1"

[lib]
name = "moviebox_tui"
path = "src/lib.rs"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
nonminimal_bool = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = "0.1.52"
